[project]
name = "rh-launch-radar"
version = "0.1.0"
description = "Robinhood Chain launch identification research (Blockscout PRO API)"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0",
  "eth-hash[pycryptodome]>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
