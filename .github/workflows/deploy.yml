name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify post integrity tests
        run: |
          python3 scripts/test-paper-fund-i-post.py
          python3 scripts/test-autonomous-trading-retrospective-post.py
          python3 scripts/test-backtest-contamination-post.py
          python3 scripts/test-sol-fund-winning-strategies-post.py

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=zonted
